[flake8]
ignore = 
max-line-length = 120
max-complexity = 10

[tool:pytest]
asyncio_mode = auto
addopts = 
    --doctest-modules tests 
    --cov-report term-missing 
    --cov-report html 
    --cov apolo_11/
    --cov-fail-under 95
python_files = tests/*/*.py
filterwarnings =
    ignore::FutureWarning
    