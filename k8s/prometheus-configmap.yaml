apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'apolo-11'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['apolo-11:8000']

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
