apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apolo-ingress
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: rabbitmq.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672
    - host: apolo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apolo-11
                port:
                  number: 8000
