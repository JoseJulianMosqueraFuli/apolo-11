apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-apolo
data:
  apolo-11-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Files Generated",
          "type": "stat",
          "id": 1,
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {"expr": "apolo_files_generated_total", "refId": "A"}
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 100},
                  {"color": "red", "value": 500}
                ]
              }
            }
          },
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}
        },
        {
          "title": "Current Cycle",
          "type": "stat",
          "id": 2,
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {"expr": "apolo_current_cycle", "refId": "A"}
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "blue", "value": null}
                ]
              }
            }
          },
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0}
        },
        {
          "title": "Active Missions",
          "type": "stat",
          "id": 3,
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {"expr": "apolo_missions_total", "refId": "A"}
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "purple", "value": null}
                ]
              }
            }
          },
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0}
        },
        {
          "title": "Files Generated Over Time",
          "type": "timeseries",
          "id": 4,
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {"expr": "rate(apolo_files_generated_total[1m])", "legendFormat": "files/sec", "refId": "A"}
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "lineInterpolation": "smooth",
                "fillOpacity": 20
              }
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4}
        },
        {
          "title": "Device Status by Mission",
          "type": "bargauge",
          "id": 5,
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {"expr": "apolo_device_status_count", "legendFormat": "{{mission}} - {{status}}", "refId": "A"}
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              }
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4}
        },
        {
          "title": "Device Types by Mission",
          "type": "bargauge",
          "id": 6,
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {"expr": "apolo_device_type_count", "legendFormat": "{{mission}} - {{type}}", "refId": "A"}
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"}
            }
          },
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 12}
        }
      ],
      "schemaVersion": 39,
      "tags": ["apolo-11"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "title": "Apollo 11 Mission Control",
      "uid": "apolo-11",
      "version": 1
    }
