[tool.poetry]
name = "apolo-11"
version = "0.1.0"
description = ""
authors = ["Jose Mosquera <jojumofu@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pyyaml = "^6.0.1"
rich = "^13.7.0"
pika = "^1.3.2"
fastapi = "^0.115.0"

[tool.poetry.dependencies.uvicorn]
version = "^0.34.0"
extras = ["standard"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.4"
pytest-cov = "^4.1.0"
flake8 = "^7.0.0"
hypothesis = "^6.92.0"
pygments = ">=2.19.3"
pytest-asyncio = "^1.3.0"

[tool.poetry.scripts]
apolo = "apolo_11.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
